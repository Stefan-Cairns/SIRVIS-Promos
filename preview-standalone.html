<title>Promo embeds preview</title>
<style>/* SIRVIS promo embeds — shared styles.
   Change the brand by editing the variables in :root. */
:root {
  /* SIRVIS brand colours (SIRVIS_Brand_Colours.docx) */
  --ink: #303E48;          /* SIRVIS Grey: headings, prices, dark blocks */
  --ink-2: #5B6A74;        /* body text, tint of SIRVIS Grey */
  --muted: #637079;        /* small print */
  --line: #DCE5E3;         /* borders */
  --bg: #ffffff;           /* page */
  --surface: #F3F7F6;      /* cards, tiles */
  --soft: #E9EEF0;         /* neutral badges */
  --accent: #02AF8B;       /* SIRVIS Green: brand highlights, large numbers, graphics */
  --tint: #C7E6E0;         /* SIRVIS Primary Disabled: light green bands and badges */
  --action: #277E6C;       /* SIRVIS Primary Hover: buttons and discount badges (white text passes AA) */
  --action-hover: #303E48; /* button hover */
  --on-action: #ffffff;    /* text on buttons */
  --good: #277E6C;         /* savings text */
  --radius: 14px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: transparent; color: var(--ink-2); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body { padding: 16px; }
h1, h2, h3 { color: var(--ink); margin: 0; line-height: 1.2; }
button, input, select { font: inherit; }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: 12.5px; color: var(--muted); }
.error { padding: 16px; background: #fff3f0; border-radius: var(--radius); color: #9b2c1b; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 0; background: var(--action); color: var(--on-action); font-weight: 700; text-decoration: none; cursor: pointer; transition: background-color .15s; }
.btn:hover { background: var(--action-hover); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
.btn:focus-visible, .chip:focus-visible, .step button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn.ghost:hover { background: var(--surface); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }

/* Header row */
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.bar h2 { font-size: 20px; }

/* Filters */
.tools { display: grid; gap: 10px; margin-bottom: 14px; }
.search { width: 100%; min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.sort { min-height: 36px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }

/* Product cards */
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 960px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
.card { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.ph { position: relative; width: 76px; height: 96px; border-radius: 10px; background: #fff; display: grid; place-items: center; overflow: hidden; }
.ph img { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); object-fit: contain; }
.ph span { font-size: 12px; font-weight: 700; color: var(--muted); }
.meta { min-width: 0; }
.supplier { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.name { font-size: 15.5px; font-weight: 700; color: var(--ink); margin: 2px 0 2px; }
.fmt { font-size: 12.5px; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.badge { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--action); color: var(--on-action); }
.badge.soft { background: var(--soft); color: var(--ink); }
.badge.free, .badge.gift { background: var(--tint); color: var(--ink); }
.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price strong { font-size: 22px; color: var(--ink); }
.price s { color: var(--muted); font-size: 13px; }
.per { font-size: 12.5px; color: var(--ink-2); }
.save { font-size: 12.5px; font-weight: 600; color: var(--good); margin-top: 2px; }
details.more { margin-top: 8px; font-size: 12.5px; }
details.more summary { cursor: pointer; color: var(--ink); font-weight: 600; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: " +"; }
details.more[open] summary::after { content: " –"; }
details.more dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0 0; }
details.more dt { color: var(--muted); }
details.more dd { margin: 0; color: var(--ink); text-align: right; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* Steppers */
.step { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: var(--bg); }
.step button { width: 40px; height: 40px; border: 0; background: none; color: var(--ink); font-size: 20px; font-weight: 700; cursor: pointer; border-radius: 999px; }
.step button:disabled { color: var(--line); cursor: default; }
.step input { width: 42px; border: 0; text-align: center; font-weight: 700; color: var(--ink); background: transparent; -moz-appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* Footer note */
.foot { margin-top: 14px; }

/* Row mode (listino.html?view=section): one swipeable row of fixed-width cards,
   so the embed height is the same on every screen. */
.rail { position: relative; }
.row-mode body { padding: 4px 0; }
.row-mode .grid { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 16px 10px; scroll-padding-inline: 16px; scrollbar-width: thin; }
.row-mode .card { flex: 0 0 290px; min-height: 290px; scroll-snap-align: start; position: relative; }
.row-mode details.more[open] dl { position: absolute; left: 10px; right: 10px; bottom: 40px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(48, 62, 72, .14); }
.nav { position: absolute; top: calc(50% - 26px); z-index: 2; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 24px; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(48, 62, 72, .15); }
.nav:hover { background: var(--surface); }
.nav.prev { left: 6px; } .nav.next { right: 6px; }
.nav:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
@media (hover: none) { .nav { display: none; } }

body { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
section { margin-top: 28px; } h1 { font-size: 22px; } h2 { font-size: 17px; margin-bottom: 2px; }
code { background: var(--surface); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
iframe { width: 100%; border: 1px dashed var(--line); border-radius: 12px; margin-top: 8px; display: block; }

&lt;style&gt;/* SIRVIS promo embeds — shared styles.

  --accent: #02AF8B;       /* SIRVIS Green: brand highlights, large numbers, graphics */
  --tint: #C7E6E0;         /* SIRVIS Primary Disabled: light green bands and badges */
  --action: #277E6C;       /* SIRVIS Primary Hover: buttons and discount badges (white text passes AA) */
  --action-hover: #303E48; /* button hover */
  --on-action: #ffffff;    /* text on buttons */

  --font: &quot;Inter&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: transparent; color: var(--ink-2); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 0; background: var(--action); color: var(--on-action); font-weight: 700; text-decoration: none; cursor: pointer; transition: background-color .15s; }

@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
.btn:focus-visible, .chip:focus-visible, .step button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn.ghost:hover { background: var(--surface); }

/* Header row */
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }

.tools { display: grid; gap: 10px; margin-bottom: 14px; }

.chips::-webkit-scrollbar { display: none; }

.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 960px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

details.more dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0 0; }
details.more dt { color: var(--muted); }

.empty { padding: 24px; text-align: center; color: var(--muted); }

/* Steppers */
.step { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: var(--bg); }
.step button { width: 40px; height: 40px; border: 0; background: none; color: var(--ink); font-size: 20px; font-weight: 700; cursor: pointer; border-radius: 999px; }
.step button:disabled { color: var(--line); cursor: default; }

/* Row mode (listino.html?view=section): one swipeable row of fixed-width cards,

.rail { position: relative; }
.row-mode body { padding: 4px 0; }

.row-mode details.more[open] dl { position: absolute; left: 10px; right: 10px; bottom: 40px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(48, 62, 72, .14); }
.nav { position: absolute; top: calc(50% - 26px); z-index: 2; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 24px; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(48, 62, 72, .15); }

    if (content) u.searchParams.set(&#x27;utm_content&#x27;, content);
    params.forEach(function (v, k) { if (/^utm_/.test(k) || k === &#x27;agent&#x27;) u.searchParams.set(k, v); });
    return u.toString();
  }

  // ---------- Iframe sizing ----------
  // Posts the content height to the parent; harmless if nothing listens.
  function autoHeight() {
    var last = 0;
    var send = function () {
      var h = Math.ceil(document.documentElement.scrollHeight);
      if (h !== last) { last = h; try { parent.postMessage({ type: &#x27;sirvis-embed-height&#x27;, height: h, embed: document.body.dataset.embed || &#x27;&#x27; }, &#x27;*&#x27;); } catch (e) {} }
    };
    if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
    window.addEventListener(&#x27;load&#x27;, send);
    send();
  }

  // ---------- Loader ----------
  function load() {
    var cfgPath = params.get(&#x27;edition&#x27;) ? &#x27;data/&#x27; + params.get(&#x27;edition&#x27;).replace(/[^a-z0-9_-]/gi, &#x27;&#x27;) + &#x27;.json&#x27; : &#x27;data/current.json&#x27;;
    // Standalone preview (preview-standalone.html) inlines the data, so it works
    // when opened as a local file, where browsers block fetch().
    var inline = window.PROMO_DATA;
    if (inline) {
      return Promise.resolve({ cfg: inline.cfg, products: parseCSV(inline.csv).filter(function (r) { return r.code; }).map(enrich) });
    }
    return fetch(cfgPath, { cache: &#x27;no-cache&#x27; })
      .then(function (r) { if (!r.ok) throw new Error(&#x27;Config non trovata: &#x27; + cfgPath); return r.json(); })
      .then(function (cfg) {
        return fetch(cfg.price_file, { cache: &#x27;no-cache&#x27; })
          .then(function (r) { if (!r.ok) throw new Error(&#x27;Listino non trovato: &#x27; + cfg.price_file); return r.text(); })
          .then(function (txt) { return { cfg: cfg, products: parseCSV(txt).filter(function (r) { return r.code; }).map(enrich) }; });
      });
  }

  function fail(el, err) {
    el.innerHTML = &#x27;&lt;p class=&quot;error&quot;&gt;Impossibile caricare le offerte. Riprova più tardi.&lt;/p&gt;&#x27;;
    if (window.console) console.error(err);
  }

  // Product image, with a neutral placeholder tile if the file is missing.
  function imageHTML(p) {
    var src = p.image || (&#x27;assets/img/&#x27; + p.code + &#x27;.png&#x27;);
    return &#x27;&lt;div class=&quot;ph&quot;&gt;&lt;img src=&quot;&#x27; + esc(src) + &#x27;&quot; alt=&quot;&#x27; + esc(p.name + &#x27; &#x27; + p.format) + &#x27;&quot; loading=&quot;lazy&quot; onerror=&quot;this.remove()&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;&#x27; + esc(p.format.replace(/^\D*/, &#x27;&#x27;)) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
  }

  window.Promo = {
    load: load, fail: fail, eur: eur, pct: pct, esc: esc, fmtDate: fmtDate,
    ctaUrl: ctaUrl, autoHeight: autoHeight, imageHTML: imageHTML,
    netPrice: netPrice, round2: round2, parseCSV: parseCSV, enrich: enrich, params: params
  };
})();
&lt;/script&gt;
&lt;script&gt;
(function () {
  var P = Promo, rowsEl = document.getElementById(&#x27;rows&#x27;), qty = {}, data;
  var MAX = 999;

  P.load().then(function (d) {
    data = d;
    document.getElementById(&#x27;cta&#x27;).textContent = d.cfg.cta_label;
    document.getElementById(&#x27;note&#x27;).textContent = &#x27;Stima indicativa. &#x27; + d.cfg.price_note + &#x27; Valida fino al &#x27; + P.fmtDate(d.cfg.valid_to) + &#x27;.&#x27;;
    var html = &#x27;&#x27;, last = &#x27;&#x27;;
    d.products.forEach(function (p) {
      qty[p.code] = 0;
      if (p.supplier !== last) { html += &#x27;&lt;div class=&quot;group&quot;&gt;&#x27; + P.esc(p.supplier) + &#x27;&lt;/div&gt;&#x27;; last = p.supplier; }
      html += &#x27;&lt;div class=&quot;row&quot; data-code=&quot;&#x27; + P.esc(p.code) + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;div&gt;&lt;h3 class=&quot;name&quot;&gt;&#x27; + P.esc(p.name) + &#x27;&lt;/h3&gt;&#x27; +
        &#x27;&lt;div class=&quot;sub num&quot;&gt;&#x27; + P.eur.format(p.net) + &#x27; / cartone da &#x27; + p.pack + &#x27; · -&#x27; + P.pct(p.discount) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;step&quot;&gt;&lt;button type=&quot;button&quot; data-d=&quot;-1&quot; aria-label=&quot;Togli un cartone di &#x27; + P.esc(p.name) + &#x27;&quot; disabled&gt;−&lt;/button&gt;&#x27; +
        &#x27;&lt;input class=&quot;num&quot; type=&quot;number&quot; inputmode=&quot;numeric&quot; min=&quot;0&quot; max=&quot;&#x27; + MAX + &#x27;&quot; value=&quot;0&quot; aria-label=&quot;Cartoni di &#x27; + P.esc(p.name) + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;button type=&quot;button&quot; data-d=&quot;1&quot; aria-label=&quot;Aggiungi un cartone di &#x27; + P.esc(p.name) + &#x27;&quot;&gt;+&lt;/button&gt;&lt;/div&gt;&#x27; +
        (p.gift ? &#x27;&lt;div class=&quot;gift&quot; data-gift&gt;&lt;/div&gt;&#x27; : &#x27;&#x27;) +
      &#x27;&lt;/div&gt;&#x27;;
    });
    rowsEl.innerHTML = html;
    // Optional preset from the URL, e.g. ?qty=100162:3,100056:2
    (P.params.get(&#x27;qty&#x27;) || &#x27;&#x27;).split(&#x27;,&#x27;).forEach(function (pair) {
      var kv = pair.split(&#x27;:&#x27;); if (kv[0] in qty) qty[kv[0]] = clamp(parseInt(kv[1], 10));
    });
    d.products.forEach(function (p) { paintRow(p.code); });
    update();
    P.autoHeight();
  }).catch(function (e) { P.fail(rowsEl, e); });

  function clamp(n) { return Math.max(0, Math.min(MAX, isNaN(n) ? 0 : n)); }
  function byCode(c) { return data.products.filter(function (p) { return p.code === c; })[0]; }

  rowsEl.addEventListener(&#x27;click&#x27;, function (e) {
    var b = e.target.closest(&#x27;button[data-d]&#x27;); if (!b) return;
    var c = b.closest(&#x27;.row&#x27;).dataset.code;
    qty[c] = clamp(qty[c] + Number(b.dataset.d)); paintRow(c); update();
  });
  rowsEl.addEventListener(&#x27;input&#x27;, function (e) {
    if (e.target.tagName !== &#x27;INPUT&#x27;) return;
    var c = e.target.closest(&#x27;.row&#x27;).dataset.code;
    qty[c] = clamp(parseInt(e.target.value, 10)); paintRow(c, true); update();
  });
  document.getElementById(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;, function () {
    Object.keys(qty).forEach(function (c) { qty[c] = 0; paintRow(c); }); update();
  });

  function giftsFor(p, n) { return p.gift ? Math.floor(n / p.gift.every) * p.gift.qty : 0; }

  function paintRow(c, typing) {
    var row = rowsEl.querySelector(&#x27;.row[data-code=&quot;&#x27; + CSS.escape(c) + &#x27;&quot;]&#x27;), n = qty[c], p = byCode(c);
    if (!typing) row.querySelector(&#x27;input&#x27;).value = n;
    row.querySelector(&#x27;[data-d=&quot;-1&quot;]&#x27;).disabled = n === 0;
    row.classList.toggle(&#x27;on&#x27;, n &gt; 0);
    var g = row.querySelector(&#x27;[data-gift]&#x27;);
    if (g) {
      var got = giftsFor(p, n), toNext = p.gift.every - (n % p.gift.every);
      g.textContent = (got ? got + &#x27; &#x27; + p.gift.item + &#x27; in omaggio · &#x27; : &#x27;Omaggio: &#x27;) +
        &#x27;+&#x27; + toNext + &#x27; &#x27; + (toNext &gt; 1 ? &#x27;cartoni&#x27; : &#x27;cartone&#x27;) + &#x27; per altri &#x27; + p.gift.qty + &#x27; &#x27; + p.gift.item.split(&#x27; &#x27;).pop() + &#x27;.&#x27;;
    }
  }

  function summary() {
    var lines = [], cases = 0, total = 0, saving = 0, gifts = [];
    data.products.forEach(function (p) {
      var n = qty[p.code]; if (!n) return;
      cases += n; total += p.net * n; saving += p.saving * n;
      lines.push(n + &#x27; × &#x27; + p.name + &#x27; (cod. &#x27; + p.code + &#x27;) = &#x27; + P.eur.format(P.round2(p.net * n)));
      var g = giftsFor(p, n); if (g) gifts.push(g + &#x27; &#x27; + p.gift.item + &#x27; (cod. &#x27; + p.gift.code + &#x27;)&#x27;);
    });
    return { lines: lines, cases: cases, total: P.round2(total), saving: P.round2(saving), gifts: gifts };
  }

  function update() {
    var s = summary();
    document.getElementById(&#x27;cases&#x27;).textContent = s.cases;
    document.getElementById(&#x27;total&#x27;).textContent = P.eur.format(s.total);
    document.getElementById(&#x27;saving&#x27;).textContent = P.eur.format(s.saving);
    var show = s.gifts.length &gt; 0;
    document.getElementById(&#x27;giftsLabel&#x27;).hidden = !show;
    var g = document.getElementById(&#x27;gifts&#x27;); g.hidden = !show; g.textContent = s.gifts.join(&#x27;, &#x27;);
    document.getElementById(&#x27;cta&#x27;).href = P.ctaUrl(data.cfg, &#x27;stima-ordine&#x27;);
  }

  document.getElementById(&#x27;copy&#x27;).addEventListener(&#x27;click&#x27;, function () {
    var s = summary(), btn = this;
    if (!s.cases) { flash(btn, &#x27;Aggiungi almeno un cartone&#x27;); return; }
    var text = data.cfg.title + &#x27; – &#x27; + data.cfg.category + &#x27;\n&#x27; + s.lines.join(&#x27;\n&#x27;) +
      (s.gifts.length ? &#x27;\nOmaggi: &#x27; + s.gifts.join(&#x27;, &#x27;) : &#x27;&#x27;) +
      &#x27;\nTotale stimato: &#x27; + P.eur.format(s.total) + &#x27; (&#x27; + data.cfg.price_note + &#x27;)&#x27;;
    var done = function () { flash(btn, &#x27;Copiato&#x27;); };
    if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallback(text); done(); });
    else { fallback(text); done(); }
  });
  function fallback(t) { var a = document.createElement(&#x27;textarea&#x27;); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand(&#x27;copy&#x27;); } catch (e) {} a.remove(); }
  function flash(b, msg) { var o = b.textContent; b.textContent = msg; setTimeout(function () { b.textContent = o; }, 1800); }
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

  if (!e.data || e.data.type !== 'sirvis-embed-height') return;
