<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scadenza offerte</title>
<link rel="stylesheet" href="assets/promo.css">
<style>
  body { padding: 12px; }
  .cd { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 20px; padding: 14px 18px; border-radius: var(--radius); background: var(--tint); color: var(--ink); text-align: center; }
  .cd .lbl { font-weight: 700; }
  .units { display: flex; gap: 8px; }
  .u { min-width: 58px; padding: 6px 4px; border-radius: 10px; background: var(--ink); color: #fff; }
  .u b { color: #fff; }
  .u b { display: block; font-size: 22px; line-height: 1.1; }
  .u span { font-size: 11px; opacity: .8; }
  .cd.over { background: var(--surface); color: var(--ink); }
</style>
</head>
<body data-embed="countdown">
<div class="cd" id="cd" role="timer" aria-live="off"><span class="lbl">Caricamento…</span></div>
<script src="assets/promo.js"></script>
<script>
(function () {
  var P = Promo, el = document.getElementById('cd');
  // End = 23:59:59 Italian time on valid_to. Works out the Rome UTC offset for that date.
  function romeEnd(iso) {
    var guess = Date.parse(iso + 'T23:59:59Z');
    var parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Rome', hour: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(guess));
    var h = Number(parts.filter(function (x) { return x.type === 'hour'; })[0].value);
    var offset = (h - 23 + 24) % 24; // hours Rome is ahead of UTC at that moment
    return guess - offset * 3600e3;
  }
  P.load().then(function (d) {
    var end = romeEnd(d.cfg.valid_to), timer;
    var start = Date.parse(d.cfg.valid_from + 'T00:00:00Z');
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function tick() {
      var ms = end - Date.now();
      if (ms <= 0) {
        el.classList.add('over');
        el.innerHTML = '<span class="lbl">Offerte scadute il ' + P.fmtDate(d.cfg.valid_to) + '. Scopri le nuove promozioni su SIRVIS.</span>' +
          '<a class="btn ghost" target="_blank" rel="noopener" href="' + P.esc(P.ctaUrl(d.cfg, 'countdown-scaduto')) + '">' + P.esc(d.cfg.cta_label) + '</a>';
        clearInterval(timer); return;
      }
      var s = Math.floor(ms / 1000), dd = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
      el.setAttribute('aria-label', 'Mancano ' + dd + ' giorni e ' + hh + ' ore alla fine delle offerte');
      el.innerHTML = '<span class="lbl">' + (Date.now() < start ? 'Le offerte iniziano il ' + P.fmtDate(d.cfg.valid_from) + ' · scadono tra' : 'Le offerte scadono tra') + '</span>' +
        '<div class="units num"><div class="u"><b>' + dd + '</b><span>giorni</span></div><div class="u"><b>' + pad(hh) + '</b><span>ore</span></div>' +
        '<div class="u"><b>' + pad(mm) + '</b><span>min</span></div><div class="u"><b>' + pad(ss) + '</b><span>sec</span></div></div>';
    }
    tick(); timer = setInterval(tick, 1000);
    P.autoHeight();
  }).catch(function (e) { P.fail(el, e); });
})();
</script>
</body>
</html>
