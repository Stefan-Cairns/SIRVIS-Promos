<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offerta omaggio</title>
<link rel="stylesheet" href="assets/promo.css">
<style>
  /* No background of its own: sits on the Foleon section colour. Dark text by default; white with ?theme=dark. */
  html, body { height: 100%; background: transparent; }
  body { padding: 0; }
  .hero { min-height: 100%; display: grid; grid-template-columns: 88px 1fr; align-content: center; align-items: center; gap: 14px 16px; padding: 16px max(16px, calc((100% - 560px) / 2)); color: var(--ink-2); }
  .hero .ph { width: 88px; height: 112px; box-shadow: inset 0 0 0 1px var(--line); }
  .hero .full { grid-column: 1 / -1; }
  .kicker { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--tint); color: var(--ink); }
  .hero h2 { color: var(--ink); font-size: 19px; margin: 8px 0 0; text-wrap: balance; }
  .hero p { margin: 0; }
  .counter { padding: 14px; border-radius: var(--radius); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 12px; color: var(--ink-2); }
  .counter .line { display: flex; align-items: center; justify-content: space-between; gap: 10px; white-space: nowrap; }
  .counter .step { background: #fff; }
  .hero .btn { font-size: 17px; }
  .got { font-size: 28px; font-weight: 800; color: var(--action); }
  .glasses { display: flex; align-items: center; gap: 4px; height: 22px; overflow: hidden; }
  .glasses b { font-size: 13px; color: var(--action); margin-left: 4px; }
  .glasses i { width: 14px; height: 22px; border-radius: 3px 3px 7px 7px; background: var(--accent); display: block; }
  .next { font-size: 13px; }
  .hero .small { color: var(--muted); }
  /* Dark or coloured section: white text, translucent counter, white button. */
  .on-dark .hero, .on-dark .hero h2 { color: #fff; }
  .on-dark .hero p, .on-dark .next { color: rgba(255,255,255,.88); }
  .on-dark .hero .small { color: rgba(255,255,255,.75); }
  .on-dark .counter { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); color: #fff; }
  .on-dark .got, .on-dark .glasses b { color: #fff; }
  .on-dark .glasses i { background: #fff; }
</style>
</head>
<body data-embed="omaggio">
<section class="hero" id="hero" aria-live="polite"><p>Caricamento…</p></section>

<script src="assets/promo.js"></script>
<script>
(function () {
  var P = Promo, hero = document.getElementById('hero');
  P.load().then(function (d) {
    // Pick the product: ?code=xxxx, else the first product with a gift mechanic.
    var want = P.params.get('code');
    var p = d.products.filter(function (x) { return x.gift && (!want || x.code === want); })[0];
    if (!p) { hero.innerHTML = '<p>Nessuna offerta omaggio in questa edizione.</p>'; P.autoHeight(); return; }
    var g = p.gift, e = P.esc, n = g.every;
    hero.innerHTML = P.imageHTML(p) +
      '<div><span class="kicker">Omaggio</span>' +
      '<h2>Ogni ' + g.every + ' cartoni di ' + e(p.name) + ', ' + g.qty + ' ' + e(g.item) + ' in omaggio</h2></div>' +
      '<p class="num full">' + e(p.format) + ' · ' + P.eur.format(p.net) + ' a cartone da ' + p.pack + ' · cod. ' + e(p.code) + '</p>' +
      '<div class="counter full">' +
        '<div class="line"><span>Cartoni</span>' +
          '<div class="step"><button type="button" data-d="-1" aria-label="Togli un cartone">−</button>' +
          '<input class="num" type="number" min="0" max="999" inputmode="numeric" aria-label="Cartoni"><button type="button" data-d="1" aria-label="Aggiungi un cartone">+</button></div></div>' +
        '<div class="line"><span><span class="got num" id="got"></span> <span id="gotLabel"></span></span><span class="num" id="cost"></span></div>' +
        '<div class="glasses" id="glasses" aria-hidden="true"></div>' +
        '<div class="next" id="next"></div>' +
        '<a class="btn" target="_blank" rel="noopener" href="' + e(P.ctaUrl(d.cfg, 'omaggio-' + p.code, p)) + '">' + e(d.cfg.cta_label) + '</a>' +
      '</div>' +
      '<p class="small full">Omaggio cod. ' + e(g.code) + '. Fino al ' + P.fmtDate(d.cfg.valid_to) + ', salvo esaurimento scorte.</p>';
    var input = hero.querySelector('input');
    function set(v) {
      n = Math.max(0, Math.min(999, isNaN(v) ? 0 : v));
      input.value = n;
      hero.querySelector('[data-d="-1"]').disabled = n === 0;
      var got = Math.floor(n / g.every) * g.qty, toNext = g.every - (n % g.every);
      document.getElementById('got').textContent = got;
      document.getElementById('gotLabel').textContent = 'in omaggio';
      document.getElementById('cost').textContent = P.eur.format(P.round2(p.net * n));
      document.getElementById('glasses').innerHTML = new Array(Math.min(got, 12) + 1).join('<i></i>') + (got > 12 ? '<b>+' + (got - 12) + '</b>' : '');
      document.getElementById('next').textContent = '+' + toNext + ' ' + (toNext > 1 ? 'cartoni' : 'cartone') + ' per altri ' + g.qty + ' ' + g.item + '.';
    }
    hero.addEventListener('click', function (ev) { var b = ev.target.closest('button[data-d]'); if (b) set(n + Number(b.dataset.d)); });
    input.addEventListener('input', function () { set(parseInt(input.value, 10)); });
    set(n);
    P.autoHeight();
  }).catch(function (err) { P.fail(hero, err); });
})();
</script>
</body>
</html>
